<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GNN HQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Doto:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root { --paper:#EDEDED; --ink:#1C1C1C; --muted:#636363; --line:rgba(28,28,28,.16); --card:#F3F3F3; --err:#6D231C; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: 'Archivo', system-ui, sans-serif;
  background: var(--paper); color: var(--ink);
  display: flex; align-items: center; justify-content: center; min-height: 100vh;
  font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
}
.card {
  width: min(320px, 90vw); display: flex; flex-direction: column; gap: 14px;
  padding: 28px 24px; background: var(--card); border: 1px solid var(--line); border-radius: 3px;
}
h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.02em; }
.field { display: flex; flex-direction: column; gap: 6px; }
label { font-size: 12px; color: var(--muted); }
input[type="password"] {
  font-family: inherit; font-size: 14px; padding: 9px 10px; width: 100%;
  border: 1px solid var(--line); border-radius: 3px; background: #fff; color: var(--ink);
}
.remember-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
button {
  font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer;
  padding: 10px 14px; border-radius: 3px; border: 1px solid var(--ink);
  background: var(--ink); color: var(--paper);
}
button:disabled { opacity: .6; cursor: default; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.msg { font-size: 12px; min-height: 14px; color: var(--muted); }
.msg.is-error { color: var(--err); }
</style>
</head>
<body>
<form class="card" id="unlock-form" autocomplete="off">

<div class="field">
<label for="passphrase">Passphrase</label>
<input type="password" id="passphrase" name="passphrase" autofocus>
</div>
<label class="remember-row"><input type="checkbox" id="remember">Remember on this device</label>
<button type="submit" id="unlock-btn">Unlock</button>
<p class="msg" id="unlock-msg" aria-live="polite"></p>
</form>

  var STORAGE_KEY = 'hq-page-key-v1';

  var form = document.getElementById('unlock-form');
  var input = document.getElementById('passphrase');
  var btn = document.getElementById('unlock-btn');
  var rememberEl = document.getElementById('remember');
  var msgEl = document.getElementById('unlock-msg');

  function b64ToBytes(b64) {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function bytesToB64(bytes) {
    var bin = '';
    for (var i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
    return btoa(bin);
  }
  function setMsg(text, isError) {
    msgEl.textContent = text || '';
    msgEl.classList.toggle('is-error', !!isError);
  }
  function setBusy(busy) {
    btn.disabled = busy;
    input.disabled = busy;
  }

  var saltBytes = b64ToBytes(PAYLOAD.salt);
  var ivBytes = b64ToBytes(PAYLOAD.iv);
  var ciphertextBytes = b64ToBytes(PAYLOAD.ciphertext);

  function deriveKey(passphrase) {
    return crypto.subtle.importKey('raw', new TextEncoder().encode(passphrase), { name: 'PBKDF2' }, false, ['deriveKey'])
      .then(function (keyMaterial) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: saltBytes, iterations: PAYLOAD.iterations, hash: 'SHA-256' },
          keyMaterial,
          { name: 'AES-GCM', length: 256 },
          true, // extractable - "remember on this device" exports the raw key
          ['decrypt']
        );
      });
  }
  function decryptWith(key) {
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivBytes }, key, ciphertextBytes);
  }
  function openPlaintext(buf) {
    var html = new TextDecoder('utf-8').decode(buf);
    document.open();
    document.write(html);
    document.close();
  }

  // ---- auto-unlock with a remembered device key, if one is saved ----
  // Stores the DERIVED AES key (raw, base64), never the passphrase itself -
  // a stolen localStorage value unlocks this one page, not the passphrase
  // the user may reuse elsewhere.
  var remembered = null;
  try { remembered = localStorage.getItem(STORAGE_KEY); } catch (e) { remembered = null; }
  if (remembered) {
    setBusy(true);
    setMsg('Unlocking...', false);
    Promise.resolve()
      .then(function () { return crypto.subtle.importKey('raw', b64ToBytes(remembered), { name: 'AES-GCM' }, false, ['decrypt']); })
      .then(decryptWith)
      .then(openPlaintext)
      .catch(function () {
        // Corrupted or stale remembered key - clear it and fall back to the
        // passphrase form rather than getting stuck failing silently forever.
        try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
        setBusy(false);
        setMsg('Saved key stopped working. Enter your passphrase.', true);
      });
  }

  // ---- passphrase form ----
  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var passphrase = input.value;
    if (!passphrase) { setMsg('Enter a passphrase.', true); return; }
    setBusy(true);
    setMsg('', false);
    deriveKey(passphrase)
      .then(function (key) {
        return decryptWith(key).then(function (plaintextBuf) {
          if (rememberEl.checked) {
            crypto.subtle.exportKey('raw', key)
              .then(function (raw) {
                try { localStorage.setItem(STORAGE_KEY, bytesToB64(new Uint8Array(raw))); } catch (e) {}
              })
              .catch(function () {});
          }
          openPlaintext(plaintextBuf);
        });
      })
      .catch(function () {
        // Wrong passphrase and corrupted ciphertext both land here (WebCrypto
        // gives no way to tell them apart, by design) - one calm message,
        // no alert(), field cleared for a fresh attempt.
        setBusy(false);
        input.value = '';
        input.focus();
        setMsg('Wrong passphrase.', true);
      });
  });
})();
